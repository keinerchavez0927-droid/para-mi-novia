<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te amo Ishita ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #050008;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .heart-container {
            position: relative;
            width: 500px;
            height: 500px;
        }

        canvas {
            position: absolute;
            inset: 0;
        }

        .message {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;

            color: #fff;
            font-size: 42px;
            font-weight: bold;
            text-shadow:
                0 0 5px #ff69b4,
                0 0 15px #ff1493,
                0 0 30px #ff1493;

            opacity: 0;
            transform: scale(0.5);
            transition: all 1.5s ease;
            pointer-events: none;
        }

        .message.show {
            opacity: 1;
            transform: scale(1);
        }

        .heart-container::after {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            background: #ff1493;
            filter: blur(100px);
            opacity: 0.12;
            left: 125px;
            top: 125px;
            z-index: -1;
        }

        @media (max-width: 600px) {
            .heart-container {
                width: 350px;
                height: 350px;
            }

            .message {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <div class="heart-container">
        <canvas id="canvas"></canvas>
        <div class="message" id="message">
            Te amo Ishita ❤️
        </div>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const message = document.getElementById("message");

        const size = 500;
        canvas.width = size;
        canvas.height = size;

        let particles = [];

        // Fórmula matemática del corazón
        function heart(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);

            const y =
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);

            return {
                x: x * 15,
                y: -y * 15
            };
        }

        // Crear partículas
        for (let i = 0; i < 700; i++) {

            const t = Math.random() * Math.PI * 2;
            const target = heart(t);

            particles.push({
                x: size / 2 + (Math.random() - 0.5) * 500,
                y: size / 2 + (Math.random() - 0.5) * 500,

                targetX: size / 2 + target.x,
                targetY: size / 2 + target.y,

                size: Math.random() * 2.5 + 0.5,

                speed: Math.random() * 0.025 + 0.008,

                color: `hsl(${320 + Math.random() * 25}, 
                          ${80 + Math.random() * 20}%, 
                          ${55 + Math.random() * 30}%)`
            });
        }

        let progress = 0;

        function animate() {

            ctx.clearRect(0, 0, size, size);

            progress += 0.003;

            particles.forEach((p) => {

                // Movimiento hacia la forma del corazón
                p.x += (p.targetX - p.x) * p.speed;
                p.y += (p.targetY - p.y) * p.speed;

                // Brillo
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;

                ctx.beginPath();
                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = p.color;
                ctx.fill();

                ctx.shadowBlur = 0;
            });

            // Cuando el corazón ya está formado
            if (progress > 1) {
                message.classList.add("show");
            }

            requestAnimationFrame(animate);
        }

        animate();

        // Pequeños corazones flotando
        function createFloatingHeart() {

            const heart = document.createElement("div");

            heart.innerHTML = "♥";

            heart.style.position = "fixed";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.bottom = "-30px";
            heart.style.color = "#ff69b4";
            heart.style.fontSize = Math.random() * 20 + 10 + "px";
            heart.style.opacity = Math.random() * 0.7 + 0.3;
            heart.style.textShadow = "0 0 10px #ff1493";
            heart.style.pointerEvents = "none";

            document.body.appendChild(heart);

            const duration = Math.random() * 4000 + 4000;

            heart.animate(
                [
                    {
                        transform: "translateY(0) scale(1)",
                        opacity: 0
                    },
                    {
                        opacity: 1
                    },
                    {
                        transform: `translateY(-110vh) scale(1.5)`,
                        opacity: 0
                    }
                ],
                {
                    duration: duration,
                    easing: "linear"
                }
            );

            setTimeout(() => {
                heart.remove();
            }, duration);
        }

        setInterval(createFloatingHeart, 400);
    </script>

</body>
</html>
