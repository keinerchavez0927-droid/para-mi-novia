<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi novia ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: radial-gradient(
                circle at center,
                #210018 0%,
                #0d0009 45%,
                #030003 100%
            );

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;
        }

        /* CONTENEDOR RESPONSIVO */
        .heart-container {
            position: relative;

            width: min(95vw, 520px);
            height: min(95vw, 520px);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        /* TEXTO */
        .message {
            position: absolute;

            width: 90%;

            text-align: center;

            color: white;

            font-size: clamp(24px, 8vw, 45px);

            font-weight: bold;

            line-height: 1.2;

            text-shadow:
                0 0 5px #fff,
                0 0 10px #ff69b4,
                0 0 20px #ff1493,
                0 0 40px #ff1493;

            opacity: 0;

            transform: scale(0.5);

            transition:
                opacity 1.5s ease,
                transform 1.5s ease;

            z-index: 10;

            pointer-events: none;
        }

        .message.show {
            opacity: 1;
            transform: scale(1);
        }

        /* BRILLO DEL CORAZÓN */
        .heart-container::after {
            content: "";

            position: absolute;

            width: 50%;
            height: 50%;

            left: 25%;
            top: 25%;

            background: #ff1493;

            filter: blur(80px);

            opacity: 0.15;

            z-index: -1;

            border-radius: 50%;
        }

        /* CORAZONES FLOTANTES */
        .floating-heart {
            position: fixed;

            bottom: -40px;

            color: #ff69b4;

            pointer-events: none;

            text-shadow:
                0 0 5px #ff1493,
                0 0 15px #ff1493;

            z-index: 20;
        }

        /* CELULARES PEQUEÑOS */
        @media (max-width: 380px) {

            .heart-container {
                width: 100vw;
                height: 100vw;
            }

            .message {
                font-size: 25px;
            }
        }

        /* PANTALLAS ALTAS DE CELULAR */
        @media (max-height: 600px) {

            .heart-container {
                width: min(90vh, 450px);
                height: min(90vh, 450px);
            }

            .message {
                font-size: clamp(22px, 7vw, 38px);
            }
        }
    </style>
</head>

<body>

    <div class="heart-container">

        <canvas id="canvas"></canvas>

        <div class="message" id="message">
            Te amo Ishita ❤️
        </div>

    </div>

    <script>

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const message = document.getElementById("message");

        /*
         * El canvas trabaja con una resolución fija
         * y luego se adapta visualmente al tamaño
         * de la pantalla.
         */

        const SIZE = 600;

        canvas.width = SIZE;
        canvas.height = SIZE;

        let particles = [];

        /*
         * CORAZÓN MATEMÁTICO
         */

        function heart(t) {

            const x =
                16 * Math.pow(Math.sin(t), 3);

            const y =
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);

            return {
                x: x * 17,
                y: -y * 17
            };
        }


        /*
         * CREAR PARTÍCULAS
         */

        const PARTICLES = 900;

        for (let i = 0; i < PARTICLES; i++) {

            const t =
                Math.random() *
                Math.PI *
                2;

            const target =
                heart(t);

            particles.push({

                x:
                    Math.random() * SIZE,

                y:
                    Math.random() * SIZE,

                targetX:
                    SIZE / 2 +
                    target.x,

                targetY:
                    SIZE / 2 +
                    target.y,

                size:
                    Math.random() * 2.5 + 0.5,

                speed:
                    Math.random() * 0.025 + 0.008,

                color:
                    `hsl(
                        ${320 + Math.random() * 25},
                        ${80 + Math.random() * 20}%,
                        ${55 + Math.random() * 30}%
                    )`

            });

        }


        /*
         * ANIMACIÓN
         */

        let formation = 0;

        function animate() {

            ctx.clearRect(
                0,
                0,
                SIZE,
                SIZE
            );

            formation += 0.004;


            particles.forEach(p => {

                /*
                 * Las partículas se acercan
                 * poco a poco al corazón.
                 */

                p.x +=
                    (p.targetX - p.x)
                    * p.speed;

                p.y +=
                    (p.targetY - p.y)
                    * p.speed;


                /*
                 * Brillo
                 */

                ctx.shadowBlur = 15;

                ctx.shadowColor =
                    p.color;


                /*
                 * Dibujar partícula
                 */

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    p.color;

                ctx.fill();


                ctx.shadowBlur = 0;

            });


            /*
             * Mostrar mensaje después
             * de que se forme el corazón.
             */

            if (formation > 1) {

                message.classList.add("show");

            }


            requestAnimationFrame(
                animate
            );

        }


        animate();


        /*
         * CORAZONES FLOTANTES
         */

        function createFloatingHeart() {

            const heart =
                document.createElement("div");

            heart.className =
                "floating-heart";

            heart.innerHTML =
                "♥";


            /*
             * Posición aleatoria
             */

            heart.style.left =
                Math.random() * 100 + "vw";


            /*
             * Tamaño aleatorio
             */

            heart.style.fontSize =
                Math.random() * 18 + 10 + "px";


            /*
             * Transparencia
             */

            heart.style.opacity =
                Math.random() * 0.6 + 0.3;


            document.body.appendChild(
                heart
            );


            const duration =
                Math.random() * 4000 + 4000;


            /*
             * Animación
             */

            heart.animate(

                [

                    {
                        transform:
                            "translateY(0) scale(0.5)",

                        opacity: 0

                    },

                    {

                        opacity: 1

                    },

                    {

                        transform:
                            "translateY(-110vh) scale(1.5)",

                        opacity: 0

                    }

                ],

                {

                    duration:
                        duration,

                    easing:
                        "linear"

                }

            );


            /*
             * Eliminar cuando termina
             */

            setTimeout(() => {

                heart.remove();

            }, duration);

        }


        /*
         * Crear corazones continuamente
         */

        setInterval(
            createFloatingHeart,
            450
        );

    </script>

</body>
</html>
