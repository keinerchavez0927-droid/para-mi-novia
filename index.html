<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Para mi novia ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(
                    circle at center,
                    #30001f 0%,
                    #12000d 45%,
                    #020002 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        /* CONTENEDOR PRINCIPAL */

        .heart-container {
            position: relative;

            width: min(92vw, 520px);
            height: min(92vw, 520px);

            max-width: 520px;
            max-height: 520px;
        }

        canvas {
            position: absolute;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            display: block;
        }

        /* TEXTO */

        .message {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.5);

            width: 90%;

            text-align: center;

            color: white;

            font-size: clamp(24px, 8vw, 46px);

            font-weight: bold;

            line-height: 1.15;

            opacity: 0;

            transition:
                opacity 1.5s ease,
                transform 1.5s ease;

            text-shadow:
                0 0 5px white,
                0 0 10px #ff69b4,
                0 0 20px #ff1493,
                0 0 40px #ff1493;

            z-index: 5;

            pointer-events: none;
        }

        .message.show {
            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }

        /* BRILLO */

        .glow {
            position: absolute;

            width: 55%;
            height: 55%;

            left: 22.5%;
            top: 22.5%;

            background: #ff1493;

            filter: blur(90px);

            opacity: 0.18;

            border-radius: 50%;

            z-index: -1;
        }

        /* CORAZONES FLOTANTES */

        .floating-heart {
            position: fixed;

            bottom: -50px;

            color: #ff69b4;

            pointer-events: none;

            z-index: 20;

            text-shadow:
                0 0 5px #ff1493,
                0 0 15px #ff1493;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            .heart-container {
                width: 94vw;
                height: 94vw;
            }

            .message {
                width: 85%;

                font-size: clamp(
                    25px,
                    8vw,
                    36px
                );
            }
        }

        /* CELULARES MUY PEQUEÑOS */

        @media (max-width: 360px) {

            .heart-container {
                width: 96vw;
                height: 96vw;
            }

            .message {
                font-size: 25px;
            }
        }

        /* CELULAR HORIZONTAL */

        @media (max-height: 500px) {

            .heart-container {
                width: 85vh;
                height: 85vh;
            }

            .message {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="heart-container">

        <div class="glow"></div>

        <canvas id="canvas"></canvas>

        <div class="message" id="message">
            Te amo Ishita ❤️
        </div>

    </div>


    <script>

        const container =
            document.querySelector(".heart-container");

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d");

        const message =
            document.getElementById("message");


        /*
        ==========================================
        CONFIGURACIÓN
        ==========================================
        */

        const PARTICLES = 800;

        let particles = [];

        let width;
        let height;

        let centerX;
        let centerY;

        let heartScale;


        /*
        ==========================================
        AJUSTAR CANVAS AL CELULAR
        ==========================================
        */

        function resize() {

            const rect =
                container.getBoundingClientRect();

            width = rect.width;
            height = rect.height;

            const dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

            canvas.width =
                width * dpr;

            canvas.height =
                height * dpr;

            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";

            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );

            centerX =
                width / 2;

            centerY =
                height / 2;

            /*
             * El corazón se adapta
             * automáticamente al tamaño.
             */

            heartScale =
                Math.min(width, height) / 36;

            createParticles();
        }


        /*
        ==========================================
        FÓRMULA DEL CORAZÓN
        ==========================================
        */

        function heart(t) {

            const x =
                16 * Math.pow(Math.sin(t), 3);

            const y =
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);

            return {
                x: x * heartScale,
                y: -y * heartScale
            };
        }


        /*
        ==========================================
        CREAR PARTÍCULAS
        ==========================================
        */

        function createParticles() {

            particles = [];

            for (
                let i = 0;
                i < PARTICLES;
                i++
            ) {

                const t =
                    Math.random() *
                    Math.PI *
                    2;

                const target =
                    heart(t);

                particles.push({

                    x:
                        Math.random() *
                        width,

                    y:
                        Math.random() *
                        height,

                    targetX:
                        centerX +
                        target.x,

                    targetY:
                        centerY +
                        target.y,

                    size:
                        Math.random() *
                        2.2 + 0.5,

                    speed:
                        Math.random() *
                        0.025 + 0.008,

                    color:
                        `hsl(
                            ${315 + Math.random() * 35},
                            ${85 + Math.random() * 15}%,
                            ${55 + Math.random() * 25}%
                        )`
                });
            }
        }


        /*
        ==========================================
        ANIMACIÓN
        ==========================================
        */

        let formation = 0;

        function animate() {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            formation += 0.004;


            particles.forEach(p => {

                p.x +=
                    (p.targetX - p.x)
                    * p.speed;

                p.y +=
                    (p.targetY - p.y)
                    * p.speed;


                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    p.color;


                ctx.shadowBlur = 12;

                ctx.shadowColor =
                    p.color;


                ctx.fill();


                ctx.shadowBlur = 0;

            });


            /*
             * Mostrar mensaje
             */

            if (formation > 1) {

                message.classList.add("show");

            }


            requestAnimationFrame(
                animate
            );
        }


        /*
        ==========================================
        CORAZONES FLOTANTES
        ==========================================
        */

        function createFloatingHeart() {

            const heart =
                document.createElement("div");

            heart.className =
                "floating-heart";

            heart.textContent =
                "♥";


            heart.style.left =
                Math.random() * 100 + "vw";


            heart.style.fontSize =
                (Math.random() * 15 + 10)
                + "px";


            const duration =
                Math.random() * 4000
                + 4000;


            document.body.appendChild(
                heart
            );


            heart.animate(

                [
                    {
                        transform:
                            "translateY(0) scale(0.5)",

                        opacity: 0
                    },

                    {
                        opacity: 1
                    },

                    {
                        transform:
                            "translateY(-110vh) scale(1.3)",

                        opacity: 0
                    }
                ],

                {
                    duration:
                        duration,

                    easing:
                        "linear"
                }
            );


            setTimeout(() => {

                heart.remove();

            }, duration);
        }


        /*
        ==========================================
        INICIAR
        ==========================================
        */

        window.addEventListener(
            "resize",
            resize
        );


        resize();

        animate();


        setInterval(
            createFloatingHeart,
            500
        );

    </script>

</body>
</html>
